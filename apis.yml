name: Marvel Fusion
description: 'Marvel Fusion is a Munich-based deep-tech company founded in 2019 that is developing
  laser-based inertial confinement fusion energy. It combines a proprietary fast-ignition approach
  with innovations across lasers, fuel targets, and power-plant design to make commercial fusion
  power viable, building on the National Ignition Facility 2022 ignition breakthrough. The company
  operates in Germany and the United States, with a demonstration facility in Fort Collins, Colorado,
  and has raised over $400M from venture capital, industrial partners, and public funding. As a
  physics and energy-infrastructure company it publishes no public developer API, SDK, or MCP
  surface; this profile captures its corporate identity and web/domain security posture.'
